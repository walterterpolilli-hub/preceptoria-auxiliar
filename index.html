                    <td className="py-1.5 px-1 text-center"><button onClick={()=>setModalAlumno(a.id)} className="text-gray-300 hover:text-indigo-500 text-sm">👁</button></td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
        </Card>

        {/* ─ RESUMEN FINAL ─ */}
        <Card>
          <p className="text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-3">🏁 Calificación Final</p>
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead><tr className="border-b border-gray-100">
                <th className="text-left py-1.5 px-1 text-gray-400 font-bold w-6">#</th>
                <th className="text-left py-1.5 px-1 text-gray-400 font-bold">Alumno/a</th>
                <th className="text-center py-1.5 px-1 text-gray-400 font-bold w-12">C1</th>
                <th className="text-center py-1.5 px-1 text-gray-400 font-bold w-12">C2</th>
                <th className="text-center py-1.5 px-1 text-gray-400 font-bold w-28">Calificación final</th>
                <th className="text-center py-1.5 px-1 text-gray-400 font-bold w-20">Familia</th>
                <th className="text-center py-1.5 px-1 text-gray-400 font-bold w-10">Ver</th>
              </tr></thead>
              <tbody>
                {ALUMNOS_CIU.map(a=>{
                  const cits=citaciones[a.id]||[];
                  const c1=getNotaEfectiva(a.id,"c1");
                  const c2=getNotaEfectiva(a.id,"c2");
                  return <tr key={a.id} className="border-b border-gray-50 hover:bg-gray-50">
                    <td className="py-1.5 px-1 text-gray-300">{a.id}</td>
                    <td className="py-1.5 px-1 font-medium">{ncCiu(a)}</td>
                    <td className="py-1.5 px-1 text-center font-bold text-gray-600">{c1||"—"}</td>
                    <td className="py-1.5 px-1 text-center font-bold text-gray-600">{c2||"—"}</td>
                    <td className="py-1.5 px-1 text-center">{finalBadge(a.id)}</td>
                    <td className="py-1.5 px-1 text-center">
                      <button onClick={()=>abrirCit(a.id)}
                        className={`text-[10px] font-bold px-2 py-0.5 rounded-full border transition ${cits.length?"bg-amber-50 text-amber-700 border-amber-200":"bg-gray-50 text-gray-500 border-gray-200 hover:bg-gray-100"}`}>
                        {cits.length?"✓ "+cits.length:"+ Citar"}
                      </button>
                    </td>
                    <td className="py-1.5 px-1 text-center"><button onClick={()=>setModalAlumno(a.id)} className="text-gray-300 hover:text-indigo-500 text-sm">👁</button></td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
        </Card>

        <div className="flex items-center justify-end gap-3">
          {ciuSync==="error" && <span className="text-[10px] text-red-500 flex-1">⚠️ {ciuErr}</span>}
          <button onClick={guardarNotasActual} disabled={ciuSync==="saving"||ciuSync==="loading"}
            className={`text-xs font-bold px-4 py-2 rounded-xl transition ${ciuSync==="saving"?"bg-gray-300 text-gray-500 cursor-not-allowed":"bg-indigo-600 hover:bg-indigo-700 text-white"}`}>
            {ciuSync==="saving"?<><span className="spin inline-block mr-1">↻</span>Guardando...</>:"💾 Guardar en Drive"}
          </button>
        </div>
      </div>;
    })()}

    {/* ── TAB INFORME ── */}
    {tabCiu==="informe" && <Card>
      <div className="flex gap-2 flex-wrap mb-3">
        {[{k:"tps",l:"TPs no entregados"},{k:"asist",l:"Asistencias"},{k:"notas",l:"Notas"},{k:"cit",l:"Citaciones"}].map(({k,l})=>
          <button key={k} onClick={()=>generarInforme(k)} className="text-xs bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 font-bold px-3 py-1.5 rounded-lg transition">{l}</button>
        )}
        <button onClick={imprimirTPs} className="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-lg transition">🖨️ Imprimir TPs</button>
      </div>
      <div className="flex gap-2 flex-wrap items-center mb-3 bg-purple-50 border border-purple-100 rounded-xl p-3">
        <span className="text-xs font-bold text-purple-700 whitespace-nowrap">📌 Informe por alumno:</span>
        <select value={selAlumnoInf} onChange={e=>setSelAlumnoInf(e.target.value)} className={`${iCls} flex-1 min-w-[160px]`}>
          <option value="">— Seleccionar alumno/a —</option>
          {[...ALUMNOS_CIU].sort((x,y)=>x.ap.localeCompare(y.ap)).map(a=><option key={a.id} value={a.id}>{ncCiu(a)}</option>)}
        </select>
        <button onClick={()=>generarInforme("alumno")} disabled={!selAlumnoInf}
          className={`text-xs font-bold px-3 py-1.5 rounded-lg transition ${selAlumnoInf?"bg-purple-600 hover:bg-purple-700 text-white":"bg-gray-200 text-gray-400 cursor-not-allowed"}`}>
          Generar
        </button>
        <button onClick={()=>imprimirInformeAlumno(selAlumnoInf)} disabled={!selAlumnoInf}
          className={`text-xs font-bold px-3 py-1.5 rounded-lg transition ${selAlumnoInf?"bg-white border border-purple-300 text-purple-700 hover:bg-purple-50":"bg-gray-200 text-gray-400 cursor-not-allowed border border-gray-200"}`}>
          🖨️ PDF
        </button>
      </div>
      <pre className="bg-gray-50 border border-gray-100 rounded-xl p-4 text-xs leading-relaxed font-mono whitespace-pre-wrap max-h-72 overflow-y-auto text-gray-700">{informe}</pre>
    </Card>}

    {/* ── TAB ALUMNOS ── */}
    {tabCiu==="alumnos" && <Card>
      <div className="flex justify-between items-center mb-3">
        <div>
          <p className="text-[10px] font-black text-gray-500 uppercase tracking-widest">Listado del curso</p>
          <p className="text-[11px] text-gray-400">{alumnosCiu.length} alumnos/as</p>
        </div>
        <div className="flex items-center gap-2">
          {syncAlumnos==="saving" && <span className="text-[10px] text-gray-400"><span className="spin inline-block">↻</span></span>}
          {syncAlumnos==="ok"     && <span className="text-[10px] text-green-600 font-bold">✓ Drive</span>}
          {syncAlumnos==="error"  && <span className="text-[10px] text-red-500 font-bold">✗ Error</span>}
          <button onClick={()=>{setEditAp("");setEditNom("");setModalNuevoAlumno(true);}}
            className="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-lg">+ Agregar</button>
        </div>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-xs">
          <thead><tr className="border-b border-gray-100">
            <th className="text-left py-2 px-1 text-gray-400 font-bold w-6">#</th>
            <th className="text-left py-2 px-1 text-gray-400 font-bold">Apellido</th>
            <th className="text-left py-2 px-1 text-gray-400 font-bold">Nombre</th>
            <th className="text-center py-2 px-1 text-gray-400 font-bold w-20">Acciones</th>
          </tr></thead>
          <tbody>
            {[...alumnosCiu].sort((a,b)=>a.ap.localeCompare(b.ap)).map(a=>(
              <tr key={a.id} className="border-b border-gray-50 hover:bg-gray-50">
                <td className="py-2 px-1 text-gray-300">{a.id}</td>
                <td className="py-2 px-1 font-medium">{a.ap}</td>
                <td className="py-2 px-1">{a.nom}</td>
                <td className="py-2 px-1 text-center">
                  <div className="flex gap-1 justify-center">
                    <button onClick={()=>{setEditAp(a.ap);setEditNom(a.nom);setModalEditAlumno(a);}}
                      className="text-[10px] px-2 py-0.5 rounded border border-indigo-200 text-indigo-600 hover:bg-indigo-50 font-bold">✏️</button>
                    <button onClick={()=>eliminarAlumno(a.id)}
                      className="text-[10px] px-2 py-0.5 rounded border border-red-200 text-red-500 hover:bg-red-50 font-bold">🗑</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Card>}

    {/* ── MODAL DETALLE ALUMNO ── */}
    {modalAlumno && <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={()=>setModalAlumno(null)}>
      <div className="bg-white rounded-2xl border border-gray-100 w-full max-w-md max-h-[90vh] overflow-y-auto p-5" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center mb-4">
          <h3 className="font-bold text-sm">Detalle del alumno</h3>
          <div className="flex items-center gap-2">
            <button onClick={()=>{
              const a=ALUMNOS_CIU.find(x=>x.id===modalAlumno);
              setEditAp(a.ap); setEditNom(a.nom); setModalEditAlumno(a); setModalAlumno(null);
            }} className="text-[10px] px-2 py-1 rounded-lg border border-indigo-200 text-indigo-600 hover:bg-indigo-50 font-bold">✏️ Editar</button>
            <button onClick={()=>setModalAlumno(null)} className="text-gray-300 hover:text-gray-600 text-lg leading-none">×</button>
          </div>
        </div>
        {detalleAlumno(modalAlumno)}
      </div>
    </div>}

    {/* ── MODAL NUEVO TP ── */}
    {modalTP && <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={()=>setModalTP(false)}>
      <div className="bg-white rounded-2xl border border-gray-100 w-full max-w-sm p-5" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center mb-4">
          <h3 className="font-bold text-sm">Nuevo Trabajo Práctico</h3>
          <button onClick={()=>setModalTP(false)} className="text-gray-300 hover:text-gray-600 text-lg leading-none">×</button>
        </div>
        <div className="space-y-3">
          <Inp label="Número de TP" type="number" min="1" value={tpNum} onChange={e=>setTpNum(e.target.value)} placeholder="1"/>
          <Inp label="Nombre / tema" value={tpNom} onChange={e=>setTpNom(e.target.value)} placeholder="Ej: Ser humano y ciudadanía"/>
          <div className="grid grid-cols-2 gap-3">
            <Inp label="Fecha de entrega" type="date" value={tpFec} onChange={e=>setTpFec(e.target.value)}/>
            <Sel label="¿Es grupal?" value={tpGrup} onChange={e=>setTpGrup(e.target.value)} opts={["no","si"]}/>
          </div>
          <div className="text-right pt-1">
            <button onClick={crearTP} className="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl transition">Crear TP</button>
          </div>
        </div>
      </div>
    </div>}

    {/* ── MODAL CITACIÓN ── */}
    {modalCit && <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={()=>setModalCit(null)}>
      <div className="bg-white rounded-2xl border border-gray-100 w-full max-w-sm p-5" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center mb-4">
          <h3 className="font-bold text-sm">Citación — {ncCiu(ALUMNOS_CIU.find(x=>x.id===modalCit)||{ap:"",nom:""})}</h3>
          <button onClick={()=>setModalCit(null)} className="text-gray-300 hover:text-gray-600 text-lg leading-none">×</button>
        </div>
        <div className="space-y-3">
          <div>
            <label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 block">Motivo/s</label>
            <div className="grid grid-cols-2 gap-2">
              {["Inasistencias","Conducta","Trabajo en clase","Rendimiento académico","Otras"].map(m=>(
                <label key={m} className={`flex items-center gap-2 text-xs cursor-pointer p-2 rounded-lg border transition ${citMotivos.includes(m)?"bg-indigo-50 border-indigo-300":"bg-white border-gray-200 hover:bg-gray-50"} ${m==="Otras"?"col-span-2":""}`}>
                  <input type="checkbox" checked={citMotivos.includes(m)} onChange={ev=>setCitMot(prev=>ev.target.checked?[...prev,m]:prev.filter(x=>x!==m))} className="accent-indigo-600"/>
                  {m}
                </label>
              ))}
            </div>
          </div>
          {citMotivos.includes("Otras")&&<Inp label="Especificar" value={citOtras} onChange={e=>setCitOtras(e.target.value)} placeholder="Describir motivo..."/>}
          <Inp label="Fecha de citación" type="date" value={citFecha} onChange={e=>setCitFecha(e.target.value)}/>
          <Txa label="Observaciones (opcional)" value={citObs} onChange={e=>setCitObs(e.target.value)} rows={2} placeholder="Notas adicionales..."/>
          <div className="text-right">
            <button onClick={guardarCitacion} className="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl transition">Registrar citación</button>
          </div>
        </div>
      </div>
    </div>}

    {/* ── MODAL NUEVO ALUMNO ── */}
    {modalNuevoAlumno && <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={()=>setModalNuevoAlumno(false)}>
      <div className="bg-white rounded-2xl border border-gray-100 w-full max-w-sm p-5" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center mb-4">
          <h3 className="font-bold text-sm">Agregar alumno/a</h3>
          <button onClick={()=>setModalNuevoAlumno(false)} className="text-gray-300 hover:text-gray-600 text-lg leading-none">×</button>
        </div>
        <div className="space-y-3">
          <Inp label="Apellido" value={editAp} onChange={e=>setEditAp(e.target.value)} placeholder="Ej: García"/>
          <Inp label="Nombre" value={editNom} onChange={e=>setEditNom(e.target.value)} placeholder="Ej: Lucía Valentina"/>
          <div className="text-right pt-1">
            <button onClick={agregarAlumno} className="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl transition">Agregar</button>
          </div>
        </div>
      </div>
    </div>}

    {/* ── MODAL EDITAR ALUMNO ── */}
    {modalEditAlumno && <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={()=>setModalEditAlumno(null)}>
      <div className="bg-white rounded-2xl border border-gray-100 w-full max-w-sm p-5" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center mb-4">
          <h3 className="font-bold text-sm">Editar alumno/a</h3>
          <button onClick={()=>setModalEditAlumno(null)} className="text-gray-300 hover:text-gray-600 text-lg leading-none">×</button>
        </div>
        <div className="space-y-3">
          <Inp label="Apellido" value={editAp} onChange={e=>setEditAp(e.target.value)}/>
          <Inp label="Nombre" value={editNom} onChange={e=>setEditNom(e.target.value)}/>
          <div className="flex justify-between items-center pt-1">
            <button onClick={()=>eliminarAlumno(modalEditAlumno.id)}
              className="text-xs border border-red-200 text-red-500 hover:bg-red-50 font-bold px-3 py-2 rounded-xl transition">
              🗑 Eliminar
            </button>
            <button onClick={editarAlumno}
              className="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl transition">
              Guardar cambios
            </button>
          </div>
        </div>
      </div>
    </div>}

  </div>;
}

// DASHBOARD
// ══════════════════════════════════════════════════════════════════
function Dashboard({records, alumnos, setTab, escuela, setEscuela, syncStatus, loading}) {
  const tardes = records.filter(r=>r.type==="tarde").length;
  const citas  = records.filter(r=>r.type==="citacion").length;
  const acc    = records.filter(r=>r.type==="accidente").length;
  const pases  = records.filter(r=>r.type==="pase").length;
  const hoy    = records.filter(r=>r.fecha===hoyISO()).length;
  const [editEsc,setEditEsc] = useState(false);
  const [tmpEsc,setTmpEsc]   = useState(escuela);

  return <div className="space-y-5">
    <div className="bg-gradient-to-br from-slate-800 via-slate-900 to-indigo-950 rounded-2xl p-6 text-white shadow-2xl">
      {editEsc ? <div className="space-y-2">
        <input className="w-full bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-sm text-white placeholder-white/40 focus:outline-none" value={tmpEsc} onChange={e=>setTmpEsc(e.target.value)} placeholder="Nombre del establecimiento..."/>
        <div className="flex gap-2">
          <button onClick={()=>{setEscuela(tmpEsc);setEditEsc(false);}} className="bg-white text-slate-900 text-xs font-bold px-3 py-1.5 rounded-lg">Guardar</button>
          <button onClick={()=>setEditEsc(false)} className="bg-white/10 text-white text-xs px-3 py-1.5 rounded-lg">Cancelar</button>
        </div>
      </div> : <>
        <div className="flex items-start justify-between">
          <div>
            <div className="flex items-center gap-3 mb-1"><span dangerouslySetInnerHTML={{__html: '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 160\" width=\"44\" height=\"44\"><ellipse cx=\"100\" cy=\"28\" rx=\"8\" ry=\"22\" fill=\"#cc1a00\"/><rect x=\"93\" y=\"6\" width=\"14\" height=\"10\" rx=\"4\" fill=\"#cc1a00\"/><ellipse cx=\"100\" cy=\"80\" rx=\"52\" ry=\"36\" fill=\"#c8920a\"/><rect x=\"48\" y=\"80\" width=\"104\" height=\"52\" rx=\"6\" fill=\"#c8920a\"/><ellipse cx=\"100\" cy=\"80\" rx=\"52\" ry=\"36\" fill=\"none\" stroke=\"#8a6000\" stroke-width=\"2.5\"/><path d=\"M48 82 Q36 100 40 120 L58 120 Q52 102 54 82 Z\" fill=\"#b07a08\"/><path d=\"M152 82 Q164 100 160 120 L142 120 Q148 102 146 82 Z\" fill=\"#b07a08\"/><rect x=\"88\" y=\"88\" width=\"24\" height=\"36\" rx=\"5\" fill=\"#7a5200\"/><rect x=\"52\" y=\"88\" width=\"30\" height=\"9\" rx=\"3\" fill=\"#2a1800\"/><rect x=\"118\" y=\"88\" width=\"30\" height=\"9\" rx=\"3\" fill=\"#2a1800\"/><ellipse cx=\"78\" cy=\"68\" rx=\"16\" ry=\"10\" fill=\"#e8c84a\" opacity=\"0.25\"/><ellipse cx=\"74\" cy=\"64\" rx=\"7\" ry=\"4\" fill=\"#fff\" opacity=\"0.15\"/></svg>'}}/></div>
            <h1 className="text-xl font-black tracking-tight">{escuela||"Colegio Fragata Libertad"}</h1>
            <p className="text-slate-400 text-xs mt-0.5">Preceptor/a</p>
          </div>
          <div className="flex flex-col items-end gap-2">
            <button onClick={()=>{setTmpEsc(escuela);setEditEsc(true);}} className="text-xs bg-white/10 hover:bg-white/20 px-2 py-1 rounded-lg text-white/60">✏️ Editar</button>
            <SyncBadge status={syncStatus}/>
          </div>
        </div>
        <div className="mt-3 bg-white/10 rounded-xl px-3 py-2 text-xs text-white/60">📅 {new Date().toLocaleDateString("es-AR",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</div>
      </>}
    </div>

    {loading && <div className="bg-blue-50 border border-blue-200 rounded-xl px-4 py-3 text-sm text-blue-700 flex items-center gap-2"><span className="spin inline-block text-lg">↻</span> Cargando datos desde Google Drive...</div>}
    {!loading && alumnos.length===0 && <div className="bg-indigo-50 border border-indigo-200 rounded-2xl px-4 py-4">
      <p className="font-bold text-indigo-800 text-sm mb-1">👋 ¡Bienvenido/a!</p>
      <p className="text-xs text-indigo-600 mb-3">Primero cargá la lista de alumnos para empezar a registrar.</p>
      <button onClick={()=>setTab("alumnos")} className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-lg">Ir a cargar alumnos →</button>
    </div>}

    <div className="grid grid-cols-2 gap-3">
      {[
        {icon:"👥",label:"Alumnos cargados",v:alumnos.length,c:"green",t:"alumnos"},
        {icon:"📌",label:"Registros hoy",   v:hoy,           c:"slate", t:"informe"},
        {icon:"🕐",label:"Llegadas tarde",  v:tardes,        c:"indigo",t:"tarde"},
        {icon:"📋",label:"Citaciones",      v:citas,         c:"amber", t:"citacion"},
        {icon:"🚨",label:"Accidentes",      v:acc,           c:"red",   t:"accidente"},
        {icon:"📁",label:"Pases/Docs",      v:pases,         c:"teal",  t:"pases"},
      ].map(({icon,label,v,c,t})=>{
        const bg={indigo:"bg-indigo-50 border-indigo-100",amber:"bg-amber-50 border-amber-100",red:"bg-red-50 border-red-100",green:"bg-green-50 border-green-100",slate:"bg-slate-50 border-slate-100",teal:"bg-teal-50 border-teal-100"};
        const num={indigo:"text-indigo-700",amber:"text-amber-700",red:"text-red-700",green:"text-emerald-700",slate:"text-slate-700",teal:"text-teal-700"};
        return <div key={label} className={`rounded-2xl border p-4 ${bg[c]} cursor-pointer hover:opacity-80 transition`} onClick={()=>setTab(t)}>
          <div className="text-2xl">{icon}</div>
          <div className={`text-3xl font-black mt-1 ${num[c]}`}>{v}</div>
          <div className="text-xs text-gray-500 mt-0.5">{label}</div>
        </div>;
      })}
    </div>

    {records.length>0 && <Card>
      <p className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Últimos registros</p>
      {records.slice(0,6).map(r=><div key={r.id} className="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0">
        <span>{r.type==="tarde"?"🕐":r.type==="citacion"?"📋":r.type==="accidente"?"🚨":"📁"}</span>
        <span className="text-sm font-semibold text-gray-800 flex-1 truncate">{r.alumno}</span>
        <span className="text-xs text-gray-400">{r.curso}</span>
        <span className="text-xs text-gray-300">{fmtFecha(r.fecha)}</span>
      </div>)}
    </Card>}
    <Card>
      <p className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">📁 Carpeta en Drive</p>
      <p className="text-xs text-gray-500 leading-relaxed">Todo queda guardado automáticamente en <strong>"SPA"</strong> en tu Google Drive, organizado en subcarpetas: Actas de Accidente, Citaciones, Informes Diarios.</p>
    </Card>
  </div>;
}

// SPLASH SCREEN
// ══════════════════════════════════════════════════════════════════
function Splash({onEnd}) {
  const [fase,setFase] = useState(0);
  useEffect(()=>{
    const t1 = setTimeout(()=>setFase(1), 700);
    const t2 = setTimeout(()=>setFase(2), 4300);
    const t3 = setTimeout(()=>onEnd(),   5000);
    return ()=>{clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);};
  },[]);
  const css = `

// ══════════════════════════════════════════════════════════════════
// APP PRINCIPAL
// ══════════════════════════════════════════════════════════════════
function App() {
  const [splash,setSplash]   = useState(true);
  const [tab,setTab]         = useState("dashboard");
  const [records,setRecords] = useState(()=>LS.get("prec_records",[]));
  const [alumnos,setAlumnos] = useState(()=>LS.get("prec_alumnos",[]));
  const [escuela,setEscuela] = useState(()=>LS.get("prec_escuela",""));
  const [syncStatus,setSyncStatus] = useState(null);
  const [loading,setLoading] = useState(false);

  useEffect(()=>LS.set("prec_records",records),[records]);
  useEffect(()=>LS.set("prec_alumnos",alumnos),[alumnos]);
  useEffect(()=>LS.set("prec_escuela",escuela),[escuela]);

  useEffect(()=>{
    if(SCRIPT_URL.includes("REEMPLAZAR")) return;
    setLoading(true);
    fetch(SCRIPT_URL).then(r=>r.json()).then(data=>{
      if(data.ok){
        if(data.alumnos?.length) setAlumnos(data.alumnos);
        if(data.records?.length) setRecords(data.records);
        setSyncStatus("ok");
      }
    }).catch(()=>setSyncStatus("error")).finally(()=>setLoading(false));
  },[]);

  const onSaveAlumnos = async lista => {
    setSyncStatus("saving");
    try { await api({action:"saveAlumnos",data:lista}); setSyncStatus("ok"); }
    catch { setSyncStatus("error"); }
  };

  const tabs = [
    {id:"dashboard", icon:"🏠", label:"Inicio"},
    {id:"alumnos",   icon:"👥", label:"Alumnos"},
    {id:"tarde",     icon:"🕐", label:"Tardanzas"},
    {id:"citacion",  icon:"📋", label:"Citaciones"},
    {id:"accidente", icon:"🚨", label:"Accidentes"},
    {id:"pases",     icon:"📁", label:"Pases"},
    {id:"informe",   icon:"📅", label:"Informe"},
    {id:"ciudadania",icon:"🏛️", label:"Ciudadanía"},
  ];

  const props = {records,setRecords,alumnos,escuela,syncStatus};

  return <>{splash && <Splash onEnd={()=>setSplash(false)}/>}<div className="min-h-screen bg-gray-50" style={{opacity:splash?0:1,transition:"opacity 0.5s"}}>
    <div className="max-w-lg mx-auto pb-32">
      <div className="px-4 pt-6">
        {tab==="dashboard" && <Dashboard records={records} alumnos={alumnos} setTab={setTab} escuela={escuela} setEscuela={setEscuela} syncStatus={syncStatus} loading={loading}/>}
        {tab==="alumnos"   && <ModAlumnos alumnos={alumnos} setAlumnos={setAlumnos} syncStatus={syncStatus} onSaveAlumnos={onSaveAlumnos}/>}
        {tab==="tarde"     && <ModTarde     {...props}/>}
        {tab==="citacion"  && <ModCitacion  {...props}/>}
        {tab==="accidente" && <ModAccidente {...props}/>}
        {tab==="pases"     && <ModPases     {...props}/>}
        {tab==="informe"   && <ModInforme records={records} escuela={escuela}/>}
        {tab==="ciudadania" && <ModCiudadania/>}
      </div>
    </div>
    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 shadow-2xl">
      <div className="max-w-lg mx-auto flex">
        {tabs.map(({id,icon,label})=><button key={id} onClick={()=>setTab(id)}
          className={`flex-1 flex flex-col items-center py-2 text-[8px] font-bold tracking-wide transition-all ${tab===id?"text-indigo-700 border-t-2 border-indigo-600 bg-indigo-50/60":"text-gray-400 hover:text-gray-600"}`}>
          <span className="text-base">{icon}</span>
          <span className="mt-0.5">{label}</span>
        </button>)}
      </div>
    </div>
  </div></>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
