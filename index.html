<script type="text/babel">
const {useState,useEffect,useRef} = React;

// ════════════════════════════════════════════════════════════════
// ⚠️  PEGÁ AQUÍ LA URL DE TU APPS SCRIPT DEPLOYMENT
// ════════════════════════════════════════════════════════════════
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxctvonVpuPWRhFarwclyoPzMBMkDYi1atqDYyDEqQ8OTHyG41-d8A8txtVIaxkBiIWKg/exec";
// ════════════════════════════════════════════════════════════════

// ── CONSTANTES ──────────────────────────────────────────────────
const MOTIVOS_CIT = ["Uniforme incompleto o inadecuado","Problemas de convivencia","Reiteradas llegadas tarde","Inasistencias reiteradas","Conducta inapropiada","Situación familiar","Bajo rendimiento académico","Otro motivo"];
const TIPOS_ACC   = ["Caída en patio","Caída en aula","Caída en escalera","Golpe con compañero","Golpe con mobiliario","Herida cortante","Torcedura / esguince","Otro"];
const VINCULOS    = ["Madre","Padre","Tutor/a","Abuelo/a","Otro familiar"];
const MEDIOS      = ["Nota en agenda","Llamado telefónico","WhatsApp","Presencial","Correo electrónico"];
const TRASLADOS   = ["No","Sí — Retirado por familiar","Sí — SAME / Ambulancia","Sí — Guardia médica"];
const TIPOS_PASE  = ["Pase","Certificado médico","Nota informativa","Solicitud de reunión","Autorización de salida","Otro documento"];

// ── HELPERS ─────────────────────────────────────────────────────
const hoyISO    = () => new Date().toISOString().slice(0,10);
// Normaliza fechas desde Drive (dd/m/yyyy o d/m/yyyy) a ISO (yyyy-mm-dd)
const toISO = fecha => {
  if(!fecha) return "";
  if(/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return fecha; // ya es ISO
  const parts = String(fecha).split("/");
  if(parts.length===3){
    const [d,m,y] = parts;
    return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
  }
  // intenta parsear como fecha de JS (ej: "Sat Mar 14 2026...")
  try { const dt=new Date(fecha); if(!isNaN(dt)) return dt.toISOString().slice(0,10); } catch{}
  return fecha;
};
const horaAhora = () => new Date().toTimeString().slice(0,5);
const fmtFecha = v => {
  if(!v||v==="—") return "—";
  // Si ya es dd/mm/yyyy devolver directo
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(String(v))) return v;
  // Si es ISO yyyy-mm-dd convertir
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(v))){ const [y,m,d]=v.split("-"); return `${d}/${m}/${y}`; }
  return v;
};
const DIAS  = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fechaLarga = v => {
  if(!v) return "";
  // Normalizar a ISO antes de parsear
  let iso = v;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){
    const p=String(v).split("/");
    if(p.length===3){ const [d,m,y]=p; iso=`${y.slice(0,4)}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`; }
  }
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d)) return v;
  return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
};

// ── STORAGE ─────────────────────────────────────────────────────
const LS = {
  get:(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};

// ── API ──────────────────────────────────────────────────────────
async function api(payload) {
  const r = await fetch(SCRIPT_URL, { method:"POST", body:JSON.stringify(payload) });
  return r.json();
}

// ── DESCARGA BASE64 ──────────────────────────────────────────────
function descargarPDF(base64, nombre) {
  const bin = atob(base64);
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  const blob = new Blob([buf],{type:"application/pdf"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── PRINT LOCAL ──────────────────────────────────────────────────
const PRINT_CSS=`

  body{font-family:'Times New Roman',serif;font-size:12pt;color:#111;padding:2cm;line-height:1.5}
  h1{font-size:16pt;margin-bottom:4px}
  h2{font-size:13pt;margin:18px 0 6px;border-bottom:1px solid #999;padding-bottom:3px}
  .hdr{text-align:center;margin-bottom:24px;border-bottom:2px solid #111;padding-bottom:12px}
  .hdr .sub{font-size:10pt;color:#555;margin-top:3px}
  .campo{margin-bottom:12px}
  .campo label{font-weight:700;font-size:10pt;text-transform:uppercase;letter-spacing:.05em;color:#444;display:block;margin-bottom:2px}
  .valor{border-bottom:1px solid #bbb;min-height:22px;padding:2px 4px;font-size:11.5pt}
  .fila-firmas{display:flex;gap:40px;margin-top:48px}
  .firma{flex:1;border-top:1px solid #555;padding-top:6px;text-align:center;font-size:10pt;color:#555}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:10.5pt}
  th{background:#1e3a5f;color:#fff;border:1px solid #ccc;padding:6px 8px;text-align:left}
  td{border:1px solid #ccc;padding:5px 8px;vertical-align:top}
  tr:nth-child(even) td{background:#fafafa}
  .cert-img{max-width:100%;margin-top:12px;border:1px solid #ddd}
  @media print{body{padding:1.5cm}}
`;
function printDoc(html, title) {
  const w = window.open("","_blank");
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title><style>${PRINT_CSS}</style></head><body>${html}<div style="margin-top:24px;font-size:9pt;color:#aaa;text-align:center;border-top:1px solid #eee;padding-top:6px">SPA — ${new Date().toLocaleString("es-AR")}</div></body></html>`);
  w.document.close();
  setTimeout(()=>{w.focus();w.print();},400);
}

// ── UI COMPONENTS ────────────────────────────────────────────────
const iCls = "border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition w-full";
const Lbl  = ({label,children}) => <div className="flex flex-col gap-1"><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest">{label}</label>{children}</div>;
const Inp  = ({label,...p}) => <Lbl label={label}><input className={iCls} {...p}/></Lbl>;
const Sel  = ({label,opts,...p}) => <Lbl label={label}><select className={iCls} {...p}><option value="">— Seleccionar —</option>{opts.map(o=><option key={o} value={o}>{o}</option>)}</select></Lbl>;
const Txa  = ({label,rows=3,...p}) => <Lbl label={label}><textarea className={`${iCls} resize-none`} rows={rows} {...p}/></Lbl>;
const Card = ({children,xCls=""}) => <div className={`bg-white rounded-2xl shadow-sm border border-gray-100 p-5 ${xCls}`}>{children}</div>;

function SyncBadge({status}) {
  if(status==="ok")     return <span className="text-[10px] bg-green-100 text-green-700 border border-green-200 rounded-full px-2 py-0.5 font-bold">✓ Drive</span>;
  if(status==="saving") return <span className="text-[10px] bg-blue-100 text-blue-700 border border-blue-200 rounded-full px-2 py-0.5 font-bold"><span className="spin inline-block">↻</span> Guardando</span>;
  if(status==="error")  return <span className="text-[10px] bg-red-100 text-red-700 border border-red-200 rounded-full px-2 py-0.5 font-bold">✗ Error Drive</span>;
  return null;
}

function Badge({color,children}) {
  const c = {indigo:"bg-indigo-100 text-indigo-800 border-indigo-200",amber:"bg-amber-100 text-amber-800 border-amber-200",red:"bg-red-100 text-red-800 border-red-200",green:"bg-green-100 text-green-800 border-green-200",slate:"bg-slate-100 text-slate-700 border-slate-200",teal:"bg-teal-100 text-teal-800 border-teal-200"};
  return <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${c[color]||c.slate}`}>{children}</span>;
}

function SecHdr({icon,title,sub,color}) {
  const g={indigo:"from-indigo-600 to-indigo-900",amber:"from-amber-500 to-orange-700",red:"from-red-600 to-rose-800",slate:"from-slate-700 to-slate-900",green:"from-emerald-600 to-teal-800",teal:"from-teal-600 to-cyan-800"};
  return <div className={`bg-gradient-to-br ${g[color]||g.slate} rounded-2xl p-5 mb-5 text-white shadow-lg`}>
    <span className="text-3xl">{icon}</span>
    <h2 className="text-xl font-black mt-1 tracking-tight">{title}</h2>
    {sub && <p className="text-xs opacity-70 mt-0.5">{sub}</p>}
  </div>;
}

function Aviso() {
  return <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-sm text-amber-700">⚠️ No hay alumnos cargados. Andá a <strong>Alumnos</strong> para cargar la lista primero.</div>;
}

// Botones de resultado Drive
function DriveResult({res}) {
  if(!res) return null;
  return <div className="mt-3 bg-green-50 border border-green-200 rounded-xl px-4 py-3 space-y-2">
    <p className="text-sm font-bold text-green-700">✅ PDF guardado en Drive</p>
    <p className="text-[11px] text-green-600 truncate">📄 {res.name}</p>
    <div className="flex gap-2 flex-wrap pt-1">
      <a href={res.driveUrl} target="_blank" className="flex-1 text-center text-xs font-bold bg-white border border-green-300 text-green-700 hover:bg-green-50 px-3 py-2 rounded-lg transition">📂 Abrir en Drive</a>
      <a href={res.downloadUrl} target="_blank" className="flex-1 text-center text-xs font-bold bg-white border border-green-300 text-green-700 hover:bg-green-50 px-3 py-2 rounded-lg transition">⬇️ Link descarga</a>
      {res.base64 && <button onClick={()=>descargarPDF(res.base64,res.name)} className="flex-1 text-center text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg transition">💾 Guardar local</button>}
    </div>
    {/* Certificado médico — link a archivo original en Drive */}
    {res.certDriveUrl && <div className="mt-2 bg-teal-50 border border-teal-200 rounded-lg px-3 py-2">
      <p className="text-xs font-bold text-teal-700 mb-1">📎 Certificado médico guardado en calidad original</p>
      <p className="text-[10px] text-teal-600 truncate mb-1.5">🗂 {res.certFileName}</p>
      <div className="flex gap-2">
        <a href={res.certDriveUrl} target="_blank" className="flex-1 text-center text-[10px] font-bold bg-white border border-teal-300 text-teal-700 hover:bg-teal-50 px-2 py-1.5 rounded-lg transition">🔍 Ver certificado</a>
        {res.subFolderUrl && <a href={res.subFolderUrl} target="_blank" className="flex-1 text-center text-[10px] font-bold bg-white border border-teal-300 text-teal-700 hover:bg-teal-50 px-2 py-1.5 rounded-lg transition">📁 Abrir carpeta del accidente</a>}
      </div>
    </div>}
  </div>;
}

// ── SELECTOR ALUMNO: primero curso, luego alumno ─────────────────
function AlumnoSel({alumnos, value, onChange}) {
  const sel    = alumnos.find(a=>a.id===value);
  const cursos = [...new Set(alumnos.map(a=>a.curso))].sort();
  const [curso,setCurso] = useState(sel?.curso||"");
  const lista  = curso ? alumnos.filter(a=>a.curso===curso).sort((a,b)=>a.apellido.localeCompare(b.apellido)) : [];

  const handleCurso = e => {
    setCurso(e.target.value);
    onChange(null); // resetear alumno al cambiar curso
  };

  return <div className="flex flex-col gap-2">
    <Lbl label="Curso">
      <select className={iCls} value={curso} onChange={handleCurso}>
        <option value="">— Seleccionar curso —</option>
        {cursos.map(c=><option key={c} value={c}>{c}</option>)}
      </select>
    </Lbl>
    {curso && <Lbl label="Alumno/a">
      <select className={iCls} value={value||""} onChange={e=>onChange(Number(e.target.value)||e.target.value)}>
        <option value="">— Seleccionar alumno/a —</option>
        {lista.map(a=><option key={a.id} value={a.id}>{a.apellido}, {a.nombre}</option>)}
      </select>
    </Lbl>}
    {sel && <div className="flex items-center gap-2 bg-indigo-50 border border-indigo-100 rounded-xl px-3 py-2">
      <span className="text-xs text-indigo-400">✓</span>
      <span className="text-sm font-bold text-indigo-800">{sel.apellido}, {sel.nombre}</span>
      <span className="text-xs text-indigo-400 ml-auto">{sel.curso}</span>
    </div>}
  </div>;
}

// ── HISTORIAL ITEM ────────────────────────────────────────────────
function HistItem({r, type, onDelete, onPrint}) {
  const [open,setOpen] = useState(false);
  const colorMap = {tarde:"indigo",citacion:"amber",accidente:"red",pase:"teal"};
  const labelMap = {tarde:"Tardanza",citacion:"Citación",accidente:"Accidente",pase:"Pase"};
  const color = colorMap[type]; const label = labelMap[type];
  const skip = new Set(["id","alumno","curso","fecha","hora","type","certBase64","certMime"]);
  return <div className="border border-gray-100 rounded-xl overflow-hidden bg-gray-50">
    <div className="flex items-center justify-between px-4 py-2.5 cursor-pointer hover:bg-gray-100 transition" onClick={()=>setOpen(!open)}>
      <div className="flex items-center gap-2 min-w-0">
        <Badge color={color}>{label}</Badge>
        <span className="text-sm font-semibold text-gray-800 truncate">{r.alumno}</span>
        <span className="text-xs text-gray-400 hidden sm:inline">{r.curso}</span>
        {r.certBase64 && <span className="text-[9px] bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-full px-1.5 py-0.5 font-bold">📎 Cert.</span>}
      </div>
      <div className="flex items-center gap-1.5 ml-2 flex-shrink-0">
        <span className="text-xs text-gray-400">{fmtFecha(r.fecha)}</span>
        <button onClick={e=>{e.stopPropagation();onPrint(r);}} className="text-xs bg-white border border-gray-200 rounded-lg px-2 py-0.5 hover:bg-indigo-50 hover:border-indigo-200 text-gray-500 hover:text-indigo-600 transition">📄</button>
        <button onClick={e=>{e.stopPropagation();onDelete(r.id);}} className="text-gray-300 hover:text-red-400 transition text-xl leading-none">×</button>
      </div>
    </div>
    {open && <div className="px-4 pb-4 pt-2 border-t border-gray-100 bg-white text-sm space-y-1">
      {Object.entries(r).filter(([k])=>!skip.has(k)).map(([k,v])=>v?<div key={k} className="flex gap-2">
        <span className="text-gray-400 font-semibold capitalize min-w-[140px] text-xs">{k.replace(/_/g," ")}:</span>
        <span className="text-gray-700">{String(v)}</span>
      </div>:null)}
      {r.certBase64 && <div className="mt-2"><p className="text-xs font-bold text-emerald-700 mb-1">📎 Certificado médico adjunto</p><img src={r.certBase64} className="max-w-full rounded-lg border border-gray-200" style={{maxHeight:200}}/></div>}
    </div>}
  </div>;
}

// ══════════════════════════════════════════════════════════════════
// MÓDULO ALUMNOS
// ══════════════════════════════════════════════════════════════════
function ModAlumnos({alumnos, setAlumnos, syncStatus, onSaveAlumnos}) {
  const [n,setN]             = useState({apellido:"",nombre:"",curso:""});
  const [csv,setCsv]         = useState("");
  const [showCsv,setShowCsv] = useState(false);
  const [err,setErr]         = useState("");

  const agregar = async () => {
    if(!n.apellido.trim()||!n.nombre.trim()||!n.curso.trim()){setErr("Completá todos los campos.");return;}
    const nuevo = [...alumnos,{id:Date.now(),...n}];
    setAlumnos(nuevo); setN({apellido:"",nombre:"",curso:""}); setErr("");
    await onSaveAlumnos(nuevo);
  };

  const importar = async () => {
    const lines = csv.trim().split("\n").filter(Boolean);
    const ok=[],fail=[];
    lines.forEach((l,i)=>{const p=l.split(",").map(x=>x.trim());if(p.length<3||!p[0]||!p[1]||!p[2]){fail.push(i+1);return;}ok.push({id:Date.now()+i,apellido:p[0],nombre:p[1],curso:p[2]});});
    if(fail.length){setErr(`Líneas con error: ${fail.join(", ")}`);return;}
    const nuevo = [...alumnos,...ok];
    setAlumnos(nuevo); setCsv(""); setShowCsv(false); setErr("");
    await onSaveAlumnos(nuevo);
  };

  const cursos = [...new Set(alumnos.map(a=>a.curso))].sort();
  return <div className="space-y-5">
    <SecHdr icon="👥" title="Lista de Alumnos" sub="Cargá o importá el padrón del establecimiento" color="green"/>
    <Card>
      <div className="flex items-center justify-between mb-4"><p className="text-xs font-bold text-gray-500 uppercase tracking-widest">Agregar individualmente</p><SyncBadge status={syncStatus}/></div>
      <div className="grid grid-cols-3 gap-3">
        <Inp label="Apellido" placeholder="García" value={n.apellido} onChange={e=>setN({...n,apellido:e.target.value})}/>
        <Inp label="Nombre"   placeholder="Lucía"  value={n.nombre}   onChange={e=>setN({...n,nombre:e.target.value})}/>
        <Inp label="Curso"    placeholder="3° A"   value={n.curso}    onChange={e=>setN({...n,curso:e.target.value})}/>
      </div>
      {err && <p className="text-xs text-red-500 mt-2">{err}</p>}
      <button onClick={agregar} className="w-full mt-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl px-4 py-2.5 text-sm transition">+ Agregar alumno/a</button>
    </Card>
    <Card>
      <div className="flex items-center justify-between mb-2">
        <div><p className="text-xs font-bold text-gray-500 uppercase tracking-widest">Importar lista CSV</p><p className="text-xs text-gray-400 mt-0.5">Formato: <code className="bg-gray-100 rounded px-1">Apellido, Nombre, Curso</code></p></div>
        <button onClick={()=>setShowCsv(!showCsv)} className="text-xs text-indigo-600 font-bold underline">{showCsv?"Cerrar":"Abrir"}</button>
      </div>
      {showCsv && <><textarea className={`${iCls} resize-none mt-2`} rows={7} placeholder={"García, Lucía, 3° A\nLópez, Marcos, 2° B"} value={csv} onChange={e=>setCsv(e.target.value)}/><div className="flex gap-2 mt-2"><button onClick={importar} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl px-3 py-1.5 text-xs">Importar</button><button onClick={()=>{setCsv("");setShowCsv(false);}} className="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl px-3 py-1.5 text-xs">Cancelar</button></div></>}
    </Card>
    {alumnos.length>0 && <Card>
      <div className="flex items-center justify-between mb-3"><p className="text-xs font-bold text-gray-500 uppercase tracking-widest">Padrón cargado</p><div className="flex gap-1"><Badge color="green">{alumnos.length} alumnos</Badge><Badge color="slate">{cursos.length} cursos</Badge></div></div>
      {cursos.map(c=><div key={c} className="mb-4">
        <p className="text-xs font-bold text-gray-400 uppercase mb-1.5">{c}</p>
        <div className="flex flex-wrap gap-1.5">
          {alumnos.filter(a=>a.curso===c).sort((a,b)=>a.apellido.localeCompare(b.apellido)).map(a=><div key={a.id} className="flex items-center gap-1 bg-gray-100 rounded-lg px-2.5 py-1 text-xs text-gray-700">
            <span>{a.apellido}, {a.nombre}</span>
            <button onClick={async()=>{const nuevo=alumnos.filter(x=>x.id!==a.id);setAlumnos(nuevo);await onSaveAlumnos(nuevo);}} className="text-gray-300 hover:text-red-400 ml-1">×</button>
          </div>)}
        </div>
      </div>)}
      <button onClick={async()=>{if(window.confirm("¿Borrar toda la lista?")){setAlumnos([]);await onSaveAlumnos([]);}}} className="text-xs text-red-400 hover:text-red-600 underline">Limpiar lista completa</button>
    </Card>}
  </div>;
}

// MÓDULO TARDANZAS
// ══════════════════════════════════════════════════════════════════
function ModTarde({records, setRecords, alumnos, escuela, syncStatus}) {
  const [aid,setAid]   = useState(null);
  const [f,setF]       = useState({fecha:hoyISO(),hora:horaAhora(),motivo:"",notificado:""});
  const [saving,setSaving] = useState(false);
  const alumno = alumnos.find(a=>a.id===aid);

  const guardar = async () => {
    if(!alumno) return alert("Seleccioná un alumno.");
    setSaving(true);
    const r = {...f, id:Date.now(), type:"tarde", alumno:`${alumno.apellido}, ${alumno.nombre}`, curso:alumno.curso};
    setRecords(p=>[r,...p]);
    await api({action:"saveRecord",data:r});
    setSaving(false); setAid(null); setF({fecha:hoyISO(),hora:horaAhora(),motivo:"",notificado:""});
  };

  const borrar = async id => { setRecords(p=>p.filter(x=>x.id!==id)); await api({action:"deleteRecord",type:"tarde",id}); };

  const imprimirFicha = r => printDoc(`
    <div class="hdr"><h1>${escuela||"Colegio Fragata Libertad"}</h1><div class="sub">SPA — Registro de Llegada Tarde</div></div>
    <div class="campo"><label>Alumno/a</label><div class="valor">${r.alumno}</div></div>
    <div class="campo"><label>Curso</label><div class="valor">${r.curso}</div></div>
    <div class="campo"><label>Fecha</label><div class="valor">${fechaLarga(r.fecha)}</div></div>
    <div class="campo"><label>Hora de llegada</label><div class="valor">${r.hora}</div></div>
    <div class="campo"><label>Motivo</label><div class="valor">${r.motivo||"—"}</div></div>
    <div class="campo"><label>Preceptor/a notificado/a</label><div class="valor">${r.notificado||"—"}</div></div>
    <div class="fila-firmas"><div class="firma">Alumno/a</div><div class="firma">Preceptor/a</div><div class="firma">Preceptor/a de Curso</div></div>`,
  `Tardanza ${r.alumno}`);

  const imprimirInforme = curso => {
    const lista = tardes.filter(r=>r.curso===curso);
    printDoc(`<div class="hdr"><h1>${escuela||"Colegio Fragata Libertad"}</h1><div class="sub">SPA — Informe de Llegadas Tarde · ${curso}</div></div>
      <table><thead><tr><th>Alumno/a</th><th>Fecha</th><th>Hora</th><th>Motivo</th></tr></thead>
      <tbody>${lista.map(r=>`<tr><td>${r.alumno}</td><td>${fmtFecha(r.fecha)}</td><td>${r.hora||"—"}</td><td>${r.motivo||"—"}</td></tr>`).join("")}</tbody></table>
      <div class="fila-firmas"><div class="firma">Preceptor/a</div><div class="firma">Preceptor/a de Curso (${curso})</div></div>`,
    `Tardanzas ${curso}`);
  };

  const tardes = records.filter(r=>r.type==="tarde");
  const cursos = [...new Set(tardes.map(r=>r.curso))].sort();

  return <div className="space-y-5">
    <SecHdr icon="🕐" title="Llegadas Tarde" sub="Registrá tardanzas y generá informes por curso" color="indigo"/>
    {alumnos.length===0 && <Aviso/>}
    <Card>
      <div className="flex items-center justify-between mb-4"><p className="text-xs font-bold text-gray-500 uppercase tracking-widest">Nuevo registro</p><SyncBadge status={syncStatus}/></div>
      <div className="grid grid-cols-2 gap-3">
        <div className="col-span-2"><AlumnoSel alumnos={alumnos} value={aid} onChange={setAid}/></div>
        <Inp label="Fecha" type="date" value={f.fecha} onChange={e=>setF({...f,fecha:e.target.value})}/>
        <Inp label="Hora de llegada" type="time" value={f.hora} onChange={e=>setF({...f,hora:e.target.value})}/>
        <div className="col-span-2"><Inp label="Motivo (opcional)" placeholder="Ej: Transporte, salud..." value={f.motivo} onChange={e=>setF({...f,motivo:e.target.value})}/></div>
        <div className="col-span-2"><Inp label="Preceptor/a de curso notificado/a" value={f.notificado} onChange={e=>setF({...f,notificado:e.target.value})}/></div>
      </div>
      <button onClick={guardar} disabled={saving} className={`w-full mt-3 font-bold rounded-xl px-4 py-2.5 text-sm transition ${saving?"bg-gray-200 text-gray-400":"bg-indigo-600 hover:bg-indigo-700 text-white"}`}>{saving?"↻ Guardando...":"Registrar tardanza"}</button>
    </Card>
    {cursos.length>0 && <Card>
      <p className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Informes por curso</p>
      <div className="space-y-2">
        {cursos.map(curso=>{const qty=tardes.filter(r=>r.curso===curso).length;return<div key={curso} className="flex items-center justify-between bg-indigo-50 rounded-xl px-4 py-2.5">
          <div><span className="font-bold text-indigo-900 text-sm">{curso}</span><span className="text-xs text-indigo-400 ml-2">{qty} tardanza{qty!==1?"s":""}</span></div>
          <button onClick={()=>imprimirInforme(curso)} className="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-lg">📄 Informe</button>
        </div>;})}
      </div>
    </Card>}
    {tardes.length>0 && <div className="space-y-2">
      <div className="flex items-center justify-between"><p className="text-xs font-bold text-gray-500 uppercase tracking-widest">Historial</p><Badge color="indigo">{tardes.length}</Badge></div>
      {tardes.map(r=><HistItem key={r.id} r={r} type="tarde" onDelete={borrar} onPrint={imprimirFicha}/>)}
    </div>}
  </div>;
}

    const r = {...f, id:Date.now(), type:"citacion", hora:horaAhora(), alumno:`${alumno.apellido}, ${alumno.nombre}`, curso:alumno.curso};

    <div class="campo"><label>Hora</label><div class="valor">${r.hora_cita||"&nbsp;"}</div></div>

// MÓDULO ACCIDENTES
// ══════════════════════════════════════════════════════════════════
function ModAccidente({records, setRecords, alumnos, escuela, syncStatus}) {
  const [aid,setAid]     = useState(null);
  const [f,setF]         = useState({fecha:hoyISO(),hora:horaAhora(),tipo:"",como:"",lugar:"",profesor:"",lesion:"",atencion:"",directivo:"",traslado:"No",obs:""});
  const [cert,setCert]   = useState(null);  // {base64, mime, preview}
  const [saving,setSaving]   = useState(false);
  const [driveRes,setDriveRes] = useState(null);
  const [driveErr,setDriveErr] = useState(null);
  const fileRef = useRef();
  const alumno  = alumnos.find(a=>a.id===aid);

  const onCertFile = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => setCert({base64:ev.target.result, mime:file.type, preview:ev.target.result, nombre:file.name});
    reader.readAsDataURL(file);
    e.target.value="";
  };

  const guardar = async () => {
    if(!alumno||!f.tipo) return alert("Seleccioná alumno y tipo de accidente.");
    setSaving(true); setDriveRes(null); setDriveErr(null);
    const r = {
      ...f, id:Date.now(), type:"accidente",
      alumno:`${alumno.apellido}, ${alumno.nombre}`, curso:alumno.curso,
      tieneCertificado:!!cert,
      certBase64: cert?.base64 || null,
      certMime:   cert?.mime   || null,
      fechaLarga: fechaLarga(f.fecha)
    };
    setRecords(p=>[r,...p]);
    // Guardar en sheets (sin la imagen para no sobrecargar)
    await api({action:"saveRecord", data:{...r, certBase64:null, certMime:null}});
    // Generar acta PDF en Drive (con imagen)
    try {
      const res = await api({action:"saveAccidentePDF", escuela, data:r});
      if(res.ok){ setDriveRes(res); if(res.base64) descargarPDF(res.base64, res.name); }
      else setDriveErr(res.error);
    } catch(err){ setDriveErr(err.toString()); }
    setSaving(false); setAid(null); setCert(null);
    setF({fecha:hoyISO(),hora:horaAhora(),tipo:"",como:"",lugar:"",profesor:"",lesion:"",atencion:"",directivo:"",traslado:"No",obs:""});
  };

  const borrar = async id => { setRecords(p=>p.filter(x=>x.id!==id)); await api({action:"deleteRecord",type:"accidente",id}); };

  const imprimir = r => printDoc(`
    <div class="hdr"><h1>${escuela||"Colegio Fragata Libertad"}</h1><div class="sub">SPA — Acta de Accidente Escolar</div></div>
    <p style="text-align:center;font-size:10pt;margin-bottom:16px;color:#dc2626;font-weight:700">N.° ACC-${String(r.id).slice(-6)} · ${fechaLarga(r.fecha)} · ${r.hora||""}</p>
    <div class="campo"><label>Alumno/a</label><div class="valor">${r.alumno}</div></div>
    <div class="campo"><label>Curso</label><div class="valor">${r.curso}</div></div>
    <div class="campo"><label>Tipo de accidente</label><div class="valor">${r.tipo}</div></div>
    <div class="campo"><label>Lugar</label><div class="valor">${r.lugar||"&nbsp;"}</div></div>
    <div class="campo"><label>Docente a cargo</label><div class="valor">${r.profesor||"&nbsp;"}</div></div>
    <div class="campo"><label>Cómo ocurrió</label><div class="valor" style="min-height:60px">${r.como||"&nbsp;"}</div></div>
    <div class="campo"><label>Lesión</label><div class="valor" style="min-height:50px">${r.lesion||"&nbsp;"}</div></div>
    <div class="campo"><label>Atención brindada</label><div class="valor" style="min-height:50px">${r.atencion||"&nbsp;"}</div></div>
    <div class="campo"><label>Traslado</label><div class="valor">${r.traslado}</div></div>
    <div class="campo"><label>Directivo notificado</label><div class="valor">${r.directivo||"&nbsp;"}</div></div>
    <div class="campo"><label>Observaciones</label><div class="valor" style="min-height:40px">${r.obs||"&nbsp;"}</div></div>
    ${r.certBase64?`<h2 style="border-bottom:1px solid #999;margin:18px 0 8px;color:#065f46">Certificado médico adjunto</h2><img src="${r.certBase64}" class="cert-img"/>`:""}
    <div class="fila-firmas"><div class="firma">Alumno/a o familiar<br><small>Aclaración:___________</small></div><div class="firma">Docente a cargo</div><div class="firma">Preceptor/a</div><div class="firma">Dirección</div></div>`,
  `Acta Accidente — ${r.alumno}`);

  const acc = records.filter(r=>r.type==="accidente");
  return <div className="space-y-5">
    <SecHdr icon="🚨" title="Accidentes Escolares" sub="El acta se genera en Drive con el certificado médico incluido" color="red"/>
    {alumnos.length===0 && <Aviso/>}
    <Card>
      <div className="flex items-center justify-between mb-4"><p className="text-xs font-bold text-gray-500 uppercase tracking-widest">Nuevo accidente</p><SyncBadge status={syncStatus}/></div>
      <div className="grid grid-cols-2 gap-3">
        <div className="col-span-2"><AlumnoSel alumnos={alumnos} value={aid} onChange={setAid}/></div>
        <Inp label="Fecha" type="date" value={f.fecha} onChange={e=>setF({...f,fecha:e.target.value})}/>
        <Inp label="Hora" type="time" value={f.hora} onChange={e=>setF({...f,hora:e.target.value})}/>
        <Sel label="Tipo de accidente" opts={TIPOS_ACC} value={f.tipo} onChange={e=>setF({...f,tipo:e.target.value})}/>
        <Inp label="Lugar" placeholder="Patio, aula, escalera..." value={f.lugar} onChange={e=>setF({...f,lugar:e.target.value})}/>
        <div className="col-span-2"><Txa label="¿Cómo ocurrió?" placeholder="Descripción detallada..." value={f.como} onChange={e=>setF({...f,como:e.target.value})}/></div>
        <Inp label="Docente a cargo" value={f.profesor} onChange={e=>setF({...f,profesor:e.target.value})}/>
        <Inp label="Directivo notificado" value={f.directivo} onChange={e=>setF({...f,directivo:e.target.value})}/>
        <div className="col-span-2"><Txa label="Descripción de la lesión" rows={2} value={f.lesion} onChange={e=>setF({...f,lesion:e.target.value})}/></div>
        <div className="col-span-2"><Txa label="Atención brindada" rows={2} value={f.atencion} onChange={e=>setF({...f,atencion:e.target.value})}/></div>
        <Sel label="¿Requirió traslado?" opts={TRASLADOS} value={f.traslado} onChange={e=>setF({...f,traslado:e.target.value})}/>
        <Txa label="Observaciones" rows={2} value={f.obs} onChange={e=>setF({...f,obs:e.target.value})}/>
      </div>

      {/* FOTO CERTIFICADO MÉDICO */}
      <div className="mt-4 border-t border-gray-100 pt-4">
        <p className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">📎 Certificado médico (opcional)</p>
        {cert ? <div className="space-y-2">
          <div className="relative">
            <img src={cert.preview} className="w-full max-h-48 object-contain rounded-xl border border-gray-200 bg-gray-50"/>
            <button onClick={()=>setCert(null)} className="absolute top-2 right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs font-bold hover:bg-red-600 flex items-center justify-center">×</button>
          </div>
          <p className="text-xs text-gray-400">📄 {cert.nombre}</p>
          <p className="text-xs text-emerald-600 font-bold">✓ Se incluirá en el acta PDF de Drive</p>
        </div> : <div className="flex gap-2">
          <button onClick={()=>fileRef.current.click()} className="flex-1 border-2 border-dashed border-gray-200 hover:border-indigo-300 rounded-xl py-4 text-xs text-gray-400 hover:text-indigo-500 font-bold transition text-center">📷 Sacar foto / Subir imagen</button>
          <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={onCertFile}/>
        </div>}
      </div>

      <button onClick={guardar} disabled={saving} className={`w-full mt-4 font-bold rounded-xl px-4 py-2.5 text-sm transition ${saving?"bg-gray-200 text-gray-400":"bg-red-600 hover:bg-red-700 text-white"}`}>
        {saving ? "↻ Guardando y generando acta..." : "Registrar accidente y generar acta en Drive"}
      </button>
    </Card>
    {driveRes && <DriveResult res={driveRes}/>}
    {driveErr && <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-2.5 text-xs text-red-700">⚠️ {driveErr}</div>}
    {acc.length>0 && <div className="space-y-2">
      <div className="flex items-center justify-between"><p className="text-xs font-bold text-gray-500 uppercase tracking-widest">Historial</p><Badge color="red">{acc.length}</Badge></div>
      {acc.map(r=><HistItem key={r.id} r={r} type="accidente" onDelete={borrar} onPrint={imprimir}/>)}
    </div>}
  </div>;
}

function ModPases({records, setRecords, alumnos, escuela, syncStatus}) {

  const [saving,setSaving]     = useState(false);
  const [driveRes,setDriveRes] = useState(null);
  const [driveErr,setDriveErr] = useState(null);
  const [obsInf,setObsInf]     = useState("");
  const alumno = alumnos.find(a=>a.id===aid);

  const guardar = async () => {
    if(!alumno||!f.tipoDoc) return alert("Seleccioná alumno y tipo de documento.");
    setSaving(true);
    const r = {...f, id:Date.now(), type:"pase", alumno:`${alumno.apellido}, ${alumno.nombre}`, curso:alumno.curso};

  };

  const borrar = async id => { setRecords(p=>p.filter(x=>x.id!==id)); await api({action:"deleteRecord",type:"pase",id}); };

  // Informe para secretaría
  const generarInforme = async (pasesFiltrados) => {
    setDriveRes(null); setDriveErr(null);
    try {
      const res = await api({action:"saveInformePases", escuela, data:{
        fecha: fmtFecha(hoyISO()), fechaLarga:fechaLarga(hoyISO()),
        pases: pasesFiltrados, obs: obsInf
      }});
      if(res.ok){ setDriveRes(res); if(res.base64) descargarPDF(res.base64, res.name); }
      else setDriveErr(res.error);
    } catch(err){ setDriveErr(err.toString()); }
  };

  const imprimirRecibo = r => printDoc(`
    <div class="hdr"><h1>${escuela||"Colegio Fragata Libertad"}</h1><div class="sub">SPA — Recepción de Documentación</div></div>
    <div class="campo"><label>Fecha y hora</label><div class="valor">${fechaLarga(r.fecha)} — ${r.hora||"—"}</div></div>
    <div class="campo"><label>Alumno/a</label><div class="valor">${r.alumno}</div></div>
    <div class="campo"><label>Curso</label><div class="valor">${r.curso}</div></div>
    <div class="campo"><label>Tipo de documento</label><div class="valor">${r.tipoDoc}</div></div>
    <div class="campo"><label>Motivo</label><div class="valor">${r.motivo||"—"}</div></div>
    <div class="campo"><label>Adulto responsable</label><div class="valor">${r.adulto||"&nbsp;"}</div></div>
    <div class="campo"><label>Vínculo</label><div class="valor">${r.vinculo||"&nbsp;"}</div></div>
    <div class="campo"><label>Contacto</label><div class="valor">${r.contacto||"&nbsp;"}</div></div>
    <div class="campo"><label>Observaciones</label><div class="valor" style="min-height:40px">${r.obs||"&nbsp;"}</div></div>
    <div class="fila-firmas"><div class="firma">Firma adulto responsable<br><small>Aclaración:___________</small></div><div class="firma">Preceptor/a</div></div>`,
  `Pase — ${r.alumno}`);

  const pases = records.filter(r=>r.type==="pase");
  const paseHoy = pases.filter(r=>toISO(r.fecha)===hoyISO());

  return <div className="space-y-5">
    <SecHdr icon="📁" title="Pases y Documentación" sub="Registrá documentación recibida y generá informe para secretaría" color="teal"/>
    {alumnos.length===0 && <Aviso/>}
    <Card>
      <div className="flex items-center justify-between mb-4"><p className="text-xs font-bold text-gray-500 uppercase tracking-widest">Recepcionar documento</p><SyncBadge status={syncStatus}/></div>
      <div className="grid grid-cols-2 gap-3">
        <div className="col-span-2"><AlumnoSel alumnos={alumnos} value={aid} onChange={setAid}/></div>
        <Inp label="Fecha" type="date" value={f.fecha} onChange={e=>setF({...f,fecha:e.target.value})}/>
        <Inp label="Hora" type="time" value={f.hora} onChange={e=>setF({...f,hora:e.target.value})}/>
        <div className="col-span-2"><Sel label="Tipo de documento" opts={TIPOS_PASE} value={f.tipoDoc} onChange={e=>setF({...f,tipoDoc:e.target.value})}/></div>
        <div className="col-span-2"><Inp label="Motivo del pase / documento" placeholder="Ej: Consulta médica, retiro por viaje..." value={f.motivo} onChange={e=>setF({...f,motivo:e.target.value})}/></div>
        <Inp label="Adulto responsable" placeholder="Nombre completo" value={f.adulto} onChange={e=>setF({...f,adulto:e.target.value})}/>
        <Sel label="Vínculo" opts={VINCULOS} value={f.vinculo} onChange={e=>setF({...f,vinculo:e.target.value})}/>
        <div className="col-span-2"><Inp label="Teléfono / contacto del adulto" placeholder="Ej: 11-1234-5678" value={f.contacto} onChange={e=>setF({...f,contacto:e.target.value})}/></div>
        <div className="col-span-2"><Txa label="Observaciones" rows={2} value={f.obs} onChange={e=>setF({...f,obs:e.target.value})}/></div>
      </div>
      <button onClick={guardar} disabled={saving} className={`w-full mt-3 font-bold rounded-xl px-4 py-2.5 text-sm transition ${saving?"bg-gray-200 text-gray-400":"bg-teal-600 hover:bg-teal-700 text-white"}`}>{saving?"↻ Guardando...":"Registrar y guardar en Drive"}</button>
    </Card>

    {/* INFORME PARA SECRETARÍA */}
    {pases.length>0 && <Card>
      <p className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">📋 Informe para Secretaría</p>
      <p className="text-xs text-gray-400 mb-3">Genera un informe PDF de todos los pases registrados hoy ({paseHoy.length}) para entregar a secretaría.</p>
      <Txa label="Observaciones generales (opcional)" rows={2} value={obsInf} onChange={e=>setObsInf(e.target.value)}/>
      <div className="flex gap-2 mt-3">
        <button onClick={()=>generarInforme(paseHoy)} disabled={paseHoy.length===0} className={`flex-1 font-bold rounded-xl px-3 py-2.5 text-xs transition ${paseHoy.length>0?"bg-teal-600 hover:bg-teal-700 text-white":"bg-gray-100 text-gray-400 cursor-not-allowed"}`}>
          📁 Informe de hoy ({paseHoy.length})
        </button>
        <button onClick={()=>generarInforme(pases)} className="flex-1 font-bold rounded-xl px-3 py-2.5 text-xs bg-slate-600 hover:bg-slate-700 text-white transition">
          📁 Todos ({pases.length})
        </button>
      </div>
    </Card>}

    {driveRes && <DriveResult res={driveRes}/>}
    {driveErr && <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-2.5 text-xs text-red-700">⚠️ {driveErr}</div>}

    {pases.length>0 && <div className="space-y-2">
      <div className="flex items-center justify-between"><p className="text-xs font-bold text-gray-500 uppercase tracking-widest">Historial</p><Badge color="teal">{pases.length}</Badge></div>
      {pases.map(r=><HistItem key={r.id} r={r} type="pase" onDelete={borrar} onPrint={imprimirRecibo}/>)}
    </div>}
  </div>;
}

// MÓDULO INFORME DIARIO
// ══════════════════════════════════════════════════════════════════
function ModInforme({records, escuela}) {
  const [fecha,setFecha]       = useState(hoyISO());
  const [guardando,setGuardando] = useState(false);
  const [driveRes,setDriveRes] = useState(null);
  const [driveErr,setDriveErr] = useState(null);

  const del_dia = records.filter(r=>toISO(r.fecha)===fecha).sort((a,b)=>(a.hora||"00:00").localeCompare(b.hora||"00:00"));
  const tardes  = del_dia.filter(r=>r.type==="tarde");
  const citas   = del_dia.filter(r=>r.type==="citacion");
  const accs    = del_dia.filter(r=>r.type==="accidente");
  const pases   = del_dia.filter(r=>r.type==="pase");

  const buildTimeline = () => {
    const items=[];
    if(tardes.length>0){
      const hMin = tardes.reduce((m,r)=>(!m||r.hora<m)?r.hora:m,null);
      items.push({hora:hMin||"--:--",type:"tarde",titulo:`${tardes.length} llegada${tardes.length>1?"s":""} tarde`,detalle:tardes.map(r=>`${r.alumno} (${r.curso})${r.hora?" a las "+r.hora:""}`).join("; ")});
    }
    citas.forEach(r=>items.push({hora:r.hora||"--:--",type:"citacion",titulo:`Citación — ${r.alumno} (${r.curso})`,detalle:`Motivo: ${r.motivo}${r.familiar?` · Familiar: ${r.familiar}`:""}${r.fecha_cita?` · Cita: ${fmtFecha(r.fecha_cita)} ${r.hora_cita||""}`:""}`}));
    accs.forEach(r=>items.push({hora:r.hora||"--:--",type:"accidente",titulo:`Accidente — ${r.alumno} (${r.curso})`,detalle:`${r.tipo}${r.lugar?" en "+r.lugar:""}${r.profesor?" · Docente: "+r.profesor:""}${r.traslado&&r.traslado!=="No"?" · Traslado: "+r.traslado:""}`}));
    pases.forEach(r=>items.push({hora:r.hora||"--:--",type:"pase",titulo:`${r.tipoDoc||"Pase"} — ${r.alumno} (${r.curso})`,detalle:`Motivo: ${r.motivo||"—"}${r.adulto?" · Adulto: "+r.adulto:""}`}));
    return items.sort((a,b)=>a.hora.localeCompare(b.hora));
  };
  const timeline = buildTimeline();

  const guardarEnDrive = async () => {
    if(del_dia.length===0) return;
    setGuardando(true); setDriveRes(null); setDriveErr(null);
    try {
      const res = await api({action:"saveInformePDF", escuela, data:{
        fecha:fmtFecha(fecha), fechaLarga:fechaLarga(fecha),
        tardes, citas, accs, pases, timeline
      }});
      if(res.ok){ setDriveRes(res); if(res.base64) descargarPDF(res.base64, res.name); }
      else setDriveErr(res.error||"Error desconocido");
    } catch(err){ setDriveErr(err.toString()); }
    setGuardando(false);
  };

  const imprimirInforme = () => {
    if(del_dia.length===0) return alert("No hay registros para este día.");
    const TIPO_COLOR = {tarde:"#4f46e5",citacion:"#b45309",accidente:"#dc2626",pase:"#0f766e"};
    const TIPO_LABEL = {tarde:"TARDANZA",citacion:"CITACIÓN",accidente:"ACCIDENTE",pase:"PASE/DOC"};
    const tlHtml = timeline.map(item=>`
      <div style="display:flex;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #eee">
        <div style="font-weight:700;min-width:50px;color:#333">${item.hora}</div>
        <div style="flex:1">
          <div style="font-size:9pt;font-weight:700;color:${TIPO_COLOR[item.type]||"#333"};text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">${TIPO_LABEL[item.type]||item.type}</div>
          <div style="font-size:11pt;font-weight:700">${item.titulo.replace(/.*?— /,"")}</div>
          <div style="font-size:10pt;color:#666;margin-top:2px">${item.detalle}</div>
        </div>
      </div>`).join("");
    printDoc(`
      <div class="hdr"><h1>${escuela||"Colegio Fragata Libertad"}</h1><div class="sub">SPA — Informe Diario · ${fechaLarga(fecha)}</div></div>
      <div style="background:#f0f4ff;border:1px solid #c7d2fe;border-radius:6px;padding:12px;margin-bottom:18px;text-align:center">
        <span style="display:inline-block;margin-right:20px"><b style="font-size:15pt;color:#4f46e5;display:block">${tardes.length}</b>Tardanzas</span>
        <span style="display:inline-block;margin-right:20px"><b style="font-size:15pt;color:#b45309;display:block">${citas.length}</b>Citaciones</span>
        <span style="display:inline-block;margin-right:20px"><b style="font-size:15pt;color:#dc2626;display:block">${accs.length}</b>Accidentes</span>
        <span style="display:inline-block;margin-right:20px"><b style="font-size:15pt;color:#0f766e;display:block">${pases.length}</b>Pases</span>
        <span style="display:inline-block"><b style="font-size:15pt;display:block">${del_dia.length}</b>Total</span>
      </div>
      <h2>Cronología del día</h2>${tlHtml}
      ${tardes.length>0?`<h2>Tardanzas</h2><table><thead><tr><th>Alumno/a</th><th>Curso</th><th>Hora</th><th>Motivo</th><th>Preceptor notif.</th></tr></thead><tbody>${tardes.map(r=>`<tr><td>${r.alumno}</td><td>${r.curso}</td><td>${r.hora||"—"}</td><td>${r.motivo||"—"}</td><td>${r.notificado||"—"}</td></tr>`).join("")}</tbody></table>`:""}
      ${citas.length>0?`<h2>Citaciones</h2><table><thead><tr><th>Alumno/a</th><th>Curso</th><th>Motivo</th><th>Familiar</th><th>Cita</th></tr></thead><tbody>${citas.map(r=>`<tr><td>${r.alumno}</td><td>${r.curso}</td><td>${r.motivo}</td><td>${r.familiar||"—"}</td><td>${r.fecha_cita?fmtFecha(r.fecha_cita)+" "+r.hora_cita:"—"}</td></tr>`).join("")}</tbody></table>`:""}
      ${accs.length>0?`<h2>Accidentes</h2><table><thead><tr><th>Alumno/a</th><th>Curso</th><th>Hora</th><th>Tipo</th><th>Docente</th><th>Traslado</th></tr></thead><tbody>${accs.map(r=>`<tr><td>${r.alumno}</td><td>${r.curso}</td><td>${r.hora||"—"}</td><td>${r.tipo}</td><td>${r.profesor||"—"}</td><td>${r.traslado}</td></tr>`).join("")}</tbody></table>`:""}
      ${pases.length>0?`<h2>Pases y Documentación</h2><table><thead><tr><th>Alumno/a</th><th>Curso</th><th>Hora</th><th>Tipo</th><th>Motivo</th><th>Adulto</th></tr></thead><tbody>${pases.map(r=>`<tr><td>${r.alumno}</td><td>${r.curso}</td><td>${r.hora||"—"}</td><td>${r.tipoDoc||"—"}</td><td>${r.motivo||"—"}</td><td>${r.adulto||"—"}</td></tr>`).join("")}</tbody></table>`:""}
      <div class="fila-firmas"><div class="firma">Preceptor/a</div><div class="firma">Sello y firma Dirección</div></div>`,
    `Informe Diario ${fmtFecha(fecha)}`);
  };

  const colorMap={indigo:"bg-indigo-50 border-indigo-100 text-indigo-700",amber:"bg-amber-50 border-amber-100 text-amber-700",red:"bg-red-50 border-red-100 text-red-700",teal:"bg-teal-50 border-teal-100 text-teal-700",slate:"bg-slate-50 border-slate-100 text-slate-700"};
  const tlBdr={tarde:"border-indigo-300 bg-indigo-50",citacion:"border-amber-300 bg-amber-50",accidente:"border-red-300 bg-red-50",pase:"border-teal-300 bg-teal-50"};
  const tlBadge={tarde:"indigo",citacion:"amber",accidente:"red",pase:"teal"};
  const tlLabel={tarde:"Tardanza",citacion:"Citación",accidente:"Accidente",pase:"Pase"};
  const tlIcon={tarde:"🕐",citacion:"📋",accidente:"🚨",pase:"📁"};
  const tlTtl={tarde:"text-indigo-700",citacion:"text-amber-700",accidente:"text-red-700",pase:"text-teal-700"};

  return <div className="space-y-5">
    <SecHdr icon="📅" title="Informe Diario" sub="Cronología completa: tardanzas, citaciones, accidentes y pases" color="teal"/>
    <Card>
      <div className="flex items-end gap-2 flex-wrap">
        <div className="flex-1 min-w-[140px]"><Inp label="Fecha" type="date" value={fecha} onChange={e=>{setFecha(e.target.value);setDriveRes(null);setDriveErr(null);}}/></div>
        <button onClick={imprimirInforme} disabled={del_dia.length===0} className={`px-3 py-2.5 text-xs font-bold rounded-xl transition ${del_dia.length>0?"bg-teal-600 hover:bg-teal-700 text-white":"bg-gray-100 text-gray-400 cursor-not-allowed"}`}>🖨️ Imprimir</button>
        <button onClick={guardarEnDrive} disabled={del_dia.length===0||guardando} className={`px-3 py-2.5 text-xs font-bold rounded-xl transition ${del_dia.length>0&&!guardando?"bg-emerald-600 hover:bg-emerald-700 text-white":"bg-gray-100 text-gray-400 cursor-not-allowed"}`}>
          {guardando?<span className="spin inline-block mr-1">↻</span>:"📁 "}{guardando?"Guardando...":"Guardar en Drive"}
        </button>
      </div>
      {driveRes && <DriveResult res={driveRes}/>}
      {driveErr && <div className="mt-3 bg-red-50 border border-red-200 rounded-xl px-4 py-2.5 text-xs text-red-700">⚠️ {driveErr}</div>}
    </Card>

    {del_dia.length===0 ? <div className="text-center py-10 text-gray-400"><div className="text-5xl mb-3">📭</div><p className="text-sm">No hay registros para el {fmtFecha(fecha)}.</p></div> : <>
      <div className="grid grid-cols-5 gap-2">
        {[{icon:"🕐",l:"Tardanzas",v:tardes.length,c:"indigo"},{icon:"📋",l:"Citaciones",v:citas.length,c:"amber"},{icon:"🚨",l:"Accidentes",v:accs.length,c:"red"},{icon:"📁",l:"Pases",v:pases.length,c:"teal"},{icon:"📊",l:"Total",v:del_dia.length,c:"slate"}].map(({icon,l,v,c})=>
          <div key={l} className={`rounded-2xl border p-2 ${colorMap[c]} text-center`}>
            <div className="text-lg">{icon}</div>
            <div className="text-xl font-black">{v}</div>
            <div className="text-[8px] mt-0.5 opacity-70">{l}</div>
          </div>
        )}
      </div>
      <Card>
        <p className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">Cronología</p>
        {timeline.map((item,i)=><div key={i} className="flex gap-3 pb-4 relative">
          <div className="flex flex-col items-center">
            <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center text-xs flex-shrink-0 ${tlBdr[item.type]}`}>{tlIcon[item.type]}</div>
            {i<timeline.length-1 && <div className="w-0.5 bg-gray-200 flex-1 mt-1"/>}
          </div>
          <div className="flex-1 pb-1">
            <div className="flex items-center gap-2 mb-0.5">
              <span className="text-xs font-black text-gray-500">{item.hora}</span>
              <Badge color={tlBadge[item.type]}>{tlLabel[item.type]}</Badge>
            </div>
            <p className={`text-sm font-bold ${tlTtl[item.type]}`}>{item.titulo}</p>
            <p className="text-xs text-gray-500 mt-0.5 leading-relaxed">{item.detalle}</p>
          </div>
        </div>)}
      </Card>
    </>}
  </div>;
}

  const [ciuSync, setCiuSync]   = useState("idle"); // idle | loading | saving | ok | error
  const [ciuErr, setCiuErr]     = useState("");

  // Al montar: cargar TODO desde Drive
  useEffect(()=>{
    setCiuSync("loading");
    Promise.all([
      api({action:"getCiudadania"}),
      api({action:"getCiuAsistencias"}),
      api({action:"getCiuTPs"}),
      api({action:"getCiuCitaciones"}),
      api({action:"getCiuAlumnos"})
    ]).then(([rNotas, rAsist, rTPs, rCit, rAlumnos])=>{
      if(rNotas.ok && rNotas.notas && Object.keys(rNotas.notas).length>0){
        setNotas(rNotas.notas); CIU_LS.set("notas", rNotas.notas);
      }
      if(rAsist.ok && rAsist.asistencias && Object.keys(rAsist.asistencias).length>0){
        setAsist(rAsist.asistencias); CIU_LS.set("asist", rAsist.asistencias);
      }
      if(rTPs.ok && rTPs.tps && rTPs.tps.length>0){
        setTps(rTPs.tps); CIU_LS.set("tps", rTPs.tps);
        setTpEst(rTPs.tpEstados||{}); CIU_LS.set("tpest", rTPs.tpEstados||{});
      }
      if(rCit.ok && rCit.citaciones && Object.keys(rCit.citaciones).length>0){
        setCit(rCit.citaciones); CIU_LS.set("cit", rCit.citaciones);
      }
      if(rAlumnos.ok && rAlumnos.alumnos && rAlumnos.alumnos.length>0){
        setAlumnosCiu(rAlumnos.alumnos); CIU_LS.set("alumnos", rAlumnos.alumnos);
      } else {
        // Ciu_Alumnos vacía — guardar la lista actual en Drive automáticamente
        const listaActual = CIU_LS.get("alumnos", ALUMNOS_CIU_DEFAULT);
        api({action:"saveCiuAlumnos", data:{alumnos: listaActual}});
      }
      setCiuSync("ok");
    }).catch(()=>setCiuSync("idle"));
  },[]);

  // helpers alumnos
  const saveAlumnosCiu = async (lista) => {
    setAlumnosCiu(lista); CIU_LS.set("alumnos", lista);
    setSyncAlumnos("saving");
    try { const r=await api({action:"saveCiuAlumnos", data:{alumnos:lista}}); setSyncAlumnos(r.ok?"ok":"error"); }
    catch(e){ setSyncAlumnos("error"); }
  };
  const agregarAlumno = () => {
    if(!editAp.trim()||!editNom.trim()){alert("Completá apellido y nombre.");return;}
    const maxId = alumnosCiu.reduce((m,a)=>Math.max(m,a.id),0);
    const nuevo = {id:maxId+1, ap:editAp.trim(), nom:editNom.trim()};
    saveAlumnosCiu([...alumnosCiu, nuevo].sort((a,b)=>a.ap.localeCompare(b.ap)));
    setModalNuevoAlumno(false); setEditAp(""); setEditNom("");
  };
  const editarAlumno = () => {
    if(!editAp.trim()||!editNom.trim()){alert("Completá apellido y nombre.");return;}
    const lista = alumnosCiu.map(a=>a.id===modalEditAlumno.id?{...a,ap:editAp.trim(),nom:editNom.trim()}:a);
    saveAlumnosCiu(lista);
    setModalEditAlumno(null); setEditAp(""); setEditNom("");
  };
  const eliminarAlumno = (id) => {
    if(!confirm("¿Eliminar este alumno? Sus datos de asistencia, TPs y notas se conservan pero ya no aparecerá en las listas.")) return;
    saveAlumnosCiu(alumnosCiu.filter(a=>a.id!==id));
    setModalAlumno(null); setModalEditAlumno(null);
  };

  // helpers Drive save
  const driveGuardarAsist = async (datos) => {
    setSyncAsist("saving");
    try { const r=await api({action:"saveCiuAsistencias",data:{asistencias:datos}}); setSyncAsist(r.ok?"ok":"error"); }
    catch(e){ setSyncAsist("error"); }
  };
  const driveGuardarTPs = async (tpsData, estData) => {
    setSyncTPs("saving");
    try { const r=await api({action:"saveCiuTPs",data:{tps:tpsData, tpEstados:estData}}); setSyncTPs(r.ok?"ok":"error"); }
    catch(e){ setSyncTPs("error"); }
  };
  const driveGuardarCit = async (datos) => {
    setSyncCit("saving");
    try { const r=await api({action:"saveCiuCitaciones",data:{citaciones:datos}}); setSyncCit(r.ok?"ok":"error"); }
    catch(e){ setSyncCit("error"); }
  };

  // persist local + Drive
  const saveAsist = (v) => { setAsist(v); CIU_LS.set("asist",v); driveGuardarAsist(v); };
  const saveTps   = (t,e) => { setTps(t); setTpEst(e); CIU_LS.set("tps",t); CIU_LS.set("tpest",e); driveGuardarTPs(t,e); };
  const saveNotas = (v)   => { setNotas(v); CIU_LS.set("notas",v); };
  const saveCit   = (v)   => { setCit(v); CIU_LS.set("cit",v); driveGuardarCit(v); };

  // helpers asistencia
  const getAsist = (f,id) => (asistencias[f]||{})[id]||"";
  const setAsistUno = (f,id,v) => {
    const nuevo = {...asistencias, [f]:{...(asistencias[f]||{}), [id]:v}};
    saveAsist(nuevo);
  };
  const cntAus  = id => Object.values(asistencias).filter(d=>d[id]==="A").length;
  const cntPres = id => Object.values(asistencias).filter(d=>d[id]==="P").length;
  const cntJust = id => Object.values(asistencias).filter(d=>d[id]==="J").length;

  // crear TP
  const crearTP = () => {
    const num = parseInt(tpNum)||tps.length+1;
    const nombre = tpNom.trim()||("TP "+num);
    const tp = {id:"tp"+Date.now(), num, nombre, fecha:tpFec, grupal:tpGrup==="si"};
    const nuevoTps = [...tps, tp];
    const nuevoEst = {...tpEstados, [tp.id]:{}};
    ALUMNOS_CIU.forEach(a=>{ nuevoEst[tp.id][a.id]={estado:"NE",nota:""}; });
    saveTps(nuevoTps, nuevoEst);
    setSelTP(tp.id);
    setModalTP(false);
  };
  const setTPEstado = (tpId, alumId, campo, val) => {
    const nuevoEst = {...tpEstados, [tpId]:{...(tpEstados[tpId]||{}), [alumId]:{...(tpEstados[tpId]?.[alumId]||{estado:"NE",nota:""}), [campo]:val}}};
    setTpEst(nuevoEst); CIU_LS.set("tpest",nuevoEst);
    driveGuardarTPs(tps, nuevoEst);
  };

  // ── CALIFICACIÓN ANUAL ──────────────────────────────────────────
  // Estructura por alumno:
  // { b1, b2, c1, b3, b4, c2, dic_nota, dic_result, feb_nota }
  // b1/b2/b3/b4: "TEA"|"TEP"|"TED"|""
  // c1/c2: número 1-10 o ""
  // dic_nota: número 1-10 o ""   dic_result: "CCA"|"CSA"|""
  // feb_nota: número 1-10 o ""

  const getCal = (id) => ({...( notas[id]||{}), ...(notasEdit[id]||{})});

  const calcularFinal = (id) => {
    const n = getCal(id);
    const c1 = parseFloat(n.c1)||null;
    const c2 = parseFloat(n.c2)||null;
    const dic = parseFloat(n.dic_nota)||null;
    const feb = parseFloat(n.feb_nota)||null;

    // Ambos cuatrimestres aprobados con 7+
    if(c1!==null && c2!==null && c1>=7 && c2>=7){
      const prom = Math.round((c1+c2)/2*10)/10;
      return {estado:"aprobado", label:`${prom} ✓`, color:"green", detalle:`Promedio: ${c1} + ${c2} = ${prom}`};
    }
    // Si tiene nota de febrero
    if(feb!==null){
      if(feb>=4) return {estado:"aprobado", label:`${feb} ✓ Feb`, color:"green", detalle:`Aprobó en febrero: ${feb}`};
      return {estado:"desaprobado", label:`${feb} ✗ Feb`, color:"red", detalle:`Desaprobó en febrero: ${feb}`};
    }
    // Si tiene resultado de diciembre
    if(dic!==null){
      if(dic>=4) return {estado:"aprobado", label:`${dic} ✓ Dic`, color:"green", detalle:`Aprobó en diciembre: ${dic}`};
      const res = n.dic_result||"CCA";
      return {estado:"intensificacion", label:`${res} → Feb`, color:"amber", detalle:`Diciembre: ${dic} (${res}) — pasa a febrero`};
    }
    // Cuatrimestres incompletos
    if(c1===null || c2===null) return {estado:"pendiente", label:"Pendiente", color:"slate", detalle:"Faltan calificaciones"};
    // Alguno desaprobado → intensificación diciembre
    if(c1<7 || c2<7) return {estado:"intensificacion", label:"→ Dic", color:"amber", detalle:`C1:${c1} C2:${c2} — va a intensificación`};
    return {estado:"pendiente", label:"Pendiente", color:"slate", detalle:""};
  };

  const guardarNotasActual = async () => {
    const merged = {...notas, ...notasEdit};
    saveNotas(merged); setNotasEdit({});
    setCiuSync("saving"); setCiuErr("");
    try {
      const res = await api({action:"saveCiudadania", data:{notas: merged}});
      if(res.ok){ setCiuSync("ok"); }
      else { setCiuSync("error"); setCiuErr(res.error||"Error desconocido"); }
    } catch(err){ setCiuSync("error"); setCiuErr(err.toString()); }
  };
  const setNotaEdit = (id,campo,val) => {
    setNotasEdit(prev=>({...prev, [id]:{...(prev[id]||notas[id]||{}), [campo]:val}}));
  };
  const getNotaEfectiva = (id,campo) => notasEdit[id]?.[campo] ?? notas[id]?.[campo] ?? "";

  // citaciones
  const abrirCit = (id) => {
    setCitMot([]); setCitOtras(""); setCitFecha(hoyISO()); setCitObs(""); setModalCit(id);
  };
  const guardarCitacion = () => {
    if(!citMotivos.length){alert("Seleccioná al menos un motivo.");return;}
    const motivos = citMotivos.map(m=>m==="Otras"&&citOtras?`Otras: ${citOtras}`:m);
    const nuevoCit = {...citaciones, [modalCit]:[...(citaciones[modalCit]||[]), {motivos,fecha:citFecha,obs:citObs}]};
    saveCit(nuevoCit); setModalCit(null);
  };

  // informes
  const generarInforme = (tipo) => {
    const fecha = new Date().toLocaleDateString("es-AR");
    let txt="";
    if(tipo==="tps"){
      if(!tps.length){setInforme("No hay TPs creados aún.");return;}
      txt=`INFORME — TPs NO ENTREGADOS\nConstrucción de la Ciudadanía · 2° 3° Tarde\nProf. Walter Terpolilli · ${fecha}\n${"═".repeat(52)}\n`;
      tps.forEach(tp=>{
        const ne=ALUMNOS_CIU.filter(a=>{const e=(tpEstados[tp.id]||{})[a.id];return !e||e.estado==="NE";});
        if(ne.length){txt+=`\nTP ${tp.num} — ${tp.nombre}${tp.fecha?" ("+fmtFecha(tp.fecha)+")":""}\n${ne.length} sin entregar:\n`;ne.forEach(a=>txt+=`  · ${ncCiu(a)}\n`);}
      });
    } else if(tipo==="asist"){
      txt=`INFORME — ASISTENCIAS\nConstrucción de la Ciudadanía · 2° 3° Tarde\nProf. Walter Terpolilli · ${fecha}\n${"═".repeat(52)}\n\n`;
      ALUMNOS_CIU.forEach(a=>{txt+=`${String(a.id).padStart(2,"0")}. ${ncCiu(a).padEnd(36)} P:${cntPres(a.id)} A:${cntAus(a.id)} J:${cntJust(a.id)}\n`;});
    } else if(tipo==="notas"){
      txt=`INFORME — RESUMEN DE NOTAS\nConstrucción de la Ciudadanía · 2° 3° Tarde\nProf. Walter Terpolilli · ${fecha}\n${"═".repeat(52)}\n\n`;
      ALUMNOS_CIU.forEach(a=>{const n={...notas[a.id],...notasEdit[a.id]};txt+=`${String(a.id).padStart(2,"0")}. ${ncCiu(a).padEnd(36)} Ev:${n.eval||"—"} TPG:${n.tpg||"—"} Conc:${n.concepto||"—"}${n.integrado?" [INT]":""}\n`;});
    } else if(tipo==="cit"){
      txt=`INFORME — CITACIONES A FAMILIAS\nConstrucción de la Ciudadanía · 2° 3° Tarde\nProf. Walter Terpolilli · ${fecha}\n${"═".repeat(52)}\n`;
      const conCit=ALUMNOS_CIU.filter(a=>(citaciones[a.id]||[]).length>0);
      if(!conCit.length)txt+="\nNo hay citaciones registradas aún.";
      else conCit.forEach(a=>{
        const cits=citaciones[a.id];
        txt+=`\n${ncCiu(a)} (${cits.length} citación/es):\n`;
        cits.forEach(c=>{txt+=`  · ${fmtFecha(c.fecha)} — ${c.motivos.join(", ")}${c.obs?" — "+c.obs:""}\n`;});
      });
    } else if(tipo==="alumno"){
      if(!selAlumnoInf){setInforme("Seleccioná un alumno para generar su informe.");return;}
      const a=ALUMNOS_CIU.find(x=>String(x.id)===String(selAlumnoInf));
      if(!a){setInforme("Alumno no encontrado.");return;}
      txt=`INFORME INDIVIDUAL\nConstrucción de la Ciudadanía · 2° 3° Tarde\nProf. Walter Terpolilli · ${fecha}\n${"═".repeat(52)}\n\n`;
      txt+=`Alumno/a: ${ncCiu(a)} (N° ${a.id})\n\n`;

      if(!tps.length){
        txt+="No hay TPs creados aún.\n";
      } else {
        const debe = tps.filter(tp=>{const e=(tpEstados[tp.id]||{})[a.id]; return !e||e.estado==="NE";});
        const entregados = tps.filter(tp=>{const e=(tpEstados[tp.id]||{})[a.id]; return e&&e.estado!=="NE";});

        if(debe.length){
          txt+=`${ncCiu(a)} debe entregar:\n`;
          debe.forEach(tp=>{txt+=`  · TP ${tp.num} — ${tp.nombre}${tp.fecha?" (vencía "+fmtFecha(tp.fecha)+")":""}\n`;});
          txt+="\n";
        } else {
          txt+=`${ncCiu(a)} no tiene TPs pendientes de entrega.\n\n`;
        }

        if(entregados.length){
          txt+=`Y en los trabajos entregados tiene:\n`;
          entregados.forEach(tp=>{
            const e=(tpEstados[tp.id]||{})[a.id];
            const estadoTxt = e.estado==="FT" ? " (fuera de término)" : "";
            txt+=`  · TP ${tp.num} — ${tp.nombre}${estadoTxt}: nota ${e.nota||"—"}\n`;
          });
          txt+="\n";
        }
      }

      const aus=cntAus(a.id), pres=cntPres(a.id), just=cntJust(a.id);
      txt+=`Asistencia: ${pres} presencias, ${aus} ausencias, ${just} justificadas.\n`;

      const cits=citaciones[a.id]||[];
      if(cits.length){
        txt+=`\nCitaciones a la familia (${cits.length}):\n`;
        cits.forEach(c=>{txt+=`  · ${fmtFecha(c.fecha)} — ${c.motivos.join(", ")}${c.obs?" — "+c.obs:""}\n`;});
      }
    }
    setInforme(txt);
  };

  const imprimirTPs = () => {
    if(!tps.length){alert("Primero creá al menos un TP.");return;}
    const fecha=new Date().toLocaleDateString("es-AR");
    let html=`<p style="margin-bottom:12px;color:#555">Prof. Walter Terpolilli · 2° 3° Tarde · ${fecha}</p>`;
    tps.forEach(tp=>{
      const ne=ALUMNOS_CIU.filter(a=>{const e=(tpEstados[tp.id]||{})[a.id];return !e||e.estado==="NE";});
      if(ne.length){
        html+=`<h2 style="font-size:14px;margin:16px 0 4px">TP ${tp.num} — ${tp.nombre} <span style="font-weight:400;color:#777">(${ne.length} sin entregar)</span></h2>`;
        html+="<ul style='margin:0 0 8px 16px'>"+ne.map(a=>`<li>${ncCiu(a)}</li>`).join("")+"</ul>";
      }
    });
    if(!html.includes("<li>"))html+="<p style='color:#777'>Todos los alumnos entregaron todos los TPs.</p>";
    printDoc(`<div class="hdr"><h1>Colegio Fragata Libertad</h1><div class="sub">SPA — Ciudadanía · TPs no entregados — 2° 3° Tarde</div></div>${html}`, "Informe TPs Ciudadanía");
  };

  const imprimirInformeAlumno = (id) => {
    const a=ALUMNOS_CIU.find(x=>String(x.id)===String(id));
    if(!a){alert("Seleccioná un alumno primero.");return;}
    const fecha=new Date().toLocaleDateString("es-AR");
    const debe = tps.filter(tp=>{const e=(tpEstados[tp.id]||{})[a.id]; return !e||e.estado==="NE";});
    const entregados = tps.filter(tp=>{const e=(tpEstados[tp.id]||{})[a.id]; return e&&e.estado!=="NE";});
    const aus=cntAus(a.id), pres=cntPres(a.id), just=cntJust(a.id);
    const cits=citaciones[a.id]||[];

    let html=`<div class="hdr"><h1>Colegio Fragata Libertad</h1><div class="sub">SPA — Ciudadanía · Informe individual — 2° 3° Tarde — ${fecha}</div></div>`;
    html+=`<div class="campo"><label>Alumno/a</label><div class="valor">${ncCiu(a)} (N° ${a.id})</div></div>`;

    html+=`<h2>Trabajos prácticos pendientes de entrega</h2>`;
    if(!tps.length) html+="<p style='color:#777'>No hay TPs creados aún.</p>";
    else if(!debe.length) html+="<p style='color:#777'>No tiene TPs pendientes de entrega.</p>";
    else html+="<table><thead><tr><th>TP</th><th>Tema</th><th>Fecha límite</th></tr></thead><tbody>"+
      debe.map(tp=>`<tr><td>TP ${tp.num}</td><td>${tp.nombre}</td><td>${tp.fecha?fmtFecha(tp.fecha):"—"}</td></tr>`).join("")+
      "</tbody></table>";

    html+=`<h2>Trabajos prácticos entregados y notas</h2>`;
    if(!entregados.length) html+="<p style='color:#777'>Aún no registra entregas.</p>";
    else html+="<table><thead><tr><th>TP</th><th>Tema</th><th>Estado</th><th>Nota</th></tr></thead><tbody>"+
      entregados.map(tp=>{
        const e=(tpEstados[tp.id]||{})[a.id];
        return `<tr><td>TP ${tp.num}</td><td>${tp.nombre}</td><td>${e.estado==="FT"?"Fuera de término":"Entregado"}</td><td>${e.nota||"—"}</td></tr>`;
      }).join("")+
      "</tbody></table>";

    html+=`<h2>Asistencia</h2><div class="campo"><div class="valor">${pres} presencias · ${aus} ausencias · ${just} justificadas</div></div>`;

    if(cits.length){
      html+=`<h2>Citaciones a la familia</h2><table><thead><tr><th>Fecha</th><th>Motivo/s</th><th>Observaciones</th></tr></thead><tbody>`+
        cits.map(c=>`<tr><td>${fmtFecha(c.fecha)}</td><td>${c.motivos.join(", ")}</td><td>${c.obs||"—"}</td></tr>`).join("")+
        "</tbody></table>";
    }

    printDoc(html, `Informe — ${ncCiu(a)}`);
  };

  // styles inline compartidos
  const tabBtnCls = (id) => `px-3 py-1.5 text-xs font-bold rounded-lg border transition ${tabCiu===id?"bg-indigo-600 text-white border-indigo-600":"bg-white text-gray-500 border-gray-200 hover:bg-gray-50"}`;
  const estadoBadge = (e) => {
    if(e==="E")  return <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-green-100 text-green-700 border border-green-200">Entregado</span>;
    if(e==="FT") return <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 border border-amber-200">Fuera de término</span>;
    return <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700 border border-red-200">No entregado</span>;
  };
  const asistBadge = (e) => {
    if(e==="P") return <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-green-100 text-green-700 border border-green-200">P</span>;
    if(e==="A") return <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700 border border-red-200">A</span>;
    if(e==="J") return <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 border border-blue-200">J</span>;
    return <span className="text-[10px] text-gray-300">—</span>;
  };

  // filtros asistencia
  const alumFiltrados = ALUMNOS_CIU.filter(a=>{
    const e=getAsist(fechaAsist,a.id);
    if(filtroAsist&&e!==filtroAsist)return false;
    if(buscarAsist&&!ncCiu(a).toLowerCase().includes(buscarAsist.toLowerCase()))return false;
    return true;
  });

  // Detalle alumno (modal)
  const detalleAlumno = (id) => {
    const a=ALUMNOS_CIU.find(x=>x.id===id);
    const n={...notas[id],...notasEdit[id]};
    const cits=citaciones[id]||[];
    const aus=cntAus(id),pres=cntPres(id),just=cntJust(id);
    const tpsFaltantes=tps.filter(tp=>{const e=(tpEstados[tp.id]||{})[id];return !e||e.estado==="NE";}).length;
    return (
      <div>
        <div className="flex items-center gap-3 mb-4">
          <div className="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center font-bold text-indigo-700">{iniCiu(a)}</div>
          <div><p className="font-bold text-sm">{ncCiu(a)}</p><p className="text-[11px] text-gray-400">N° {a.id} · 2° 3° Tarde</p></div>
        </div>
        <div className="grid grid-cols-4 gap-2 mb-4">
          {[{v:pres,l:"Presencias",c:"text-green-600"},{v:aus,l:"Ausencias",c:"text-red-600"},{v:just,l:"Justificadas",c:"text-blue-600"},{v:tpsFaltantes,l:"TPs faltantes",c:"text-gray-700"}].map(({v,l,c})=>
            <div key={l} className="bg-gray-50 rounded-xl p-2 text-center border border-gray-100">
              <div className={`text-lg font-black ${c}`}>{v}</div>
              <div className="text-[9px] text-gray-400">{l}</div>
            </div>
          )}
        </div>
        <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Últimas clases</p>
        <div className="flex flex-wrap gap-1 mb-4">
          {Object.entries(asistencias).filter(([f,d])=>d[id]).sort(([a],[b])=>a.localeCompare(b)).slice(-10).map(([f,d])=>
            <span key={f} className="text-[10px] font-bold px-2 py-0.5 rounded-full border border-gray-200 bg-gray-50">{fmtFecha(f)} {asistBadge(d[id])}</span>
          )}
          {!Object.entries(asistencias).some(([f,d])=>d[id])&&<span className="text-xs text-gray-400">Sin registros aún</span>}
        </div>
        <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Trabajos prácticos</p>
        {tps.length===0&&<p className="text-xs text-gray-400 mb-3">No hay TPs creados aún.</p>}
        {tps.map(tp=>{
